<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <meta name="description"content="Contact Your Name for project collaboration, professional opportunities and general inquiries.">
    <meta name="author"content="Prajakta Nevaskar">
    <meta name="robots"content="index, follow">
    <title>Contact Me | Prajakta Nevaskar</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>


    <header>

        <div class="container">

            <a href="index.html"class="logo"aria-label="Prajakta Nevaskar - Home">
                Your Portfolio
            </a>

            <nav aria-label="Primary navigation">

                <ul>
                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="contact.html"aria-current="page">
                            Contact
                        </a>
                    </li>
                </ul>

            </nav>

        </div>

    </header>


    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <div class="container">

                <h1 id="contact-heading">
                    Contact Me
                </h1>

                <p>
                    Fields marked with an asterisk (*) are required.
                </p>


                <form action="#"
                      method="post"
                      aria-labelledby="contact-heading">

                    <fieldset>

                        <legend>
                            Send a message
                        </legend>


                        <div class="form-group">

                            <label for="name">
                                Full Name
                                <span aria-hidden="true">*</span>
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                autocomplete="name"
                                required
                                aria-required="true"
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                                <span aria-hidden="true">*</span>
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required
                                aria-required="true"
                            >

                        </div>


                        <div class="form-group">

                            <label for="subject">
                                Subject
                            </label>

                            <input
                                type="text"
                                id="subject"
                                name="subject"
                            >

                        </div>


                        <div class="form-group">

                            <label for="message">
                                Message
                                <span aria-hidden="true">*</span>
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                required
                                aria-required="true"
                            ></textarea>

                        </div>


                        <button type="submit">
                            Send Message
                        </button>

                    </fieldset>

                </form>

            </div>

        </section>

    </main>


    <footer>

        <div class="container">

            <p>
                &copy; 2026 Prajakta Nevaskar.
            </p>

        </div>

    </footer>

</body>
</html>
